<dialog #dialog class="projects-dialog" closedby="any">

    <div class="projects-dialog__media">

        <div class="projects-dialog__close-btn-container">
            <svg (click)="close()" class="close-btn" width="18" height="18" viewBox="0 0 18 18" fill="none"
                xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M8.93957 10.3615L1.75507 17.546C1.54207 17.7587 1.30607 17.8587 1.04707 17.846C0.788067 17.833 0.552234 17.7202 0.339568 17.5075C0.126901 17.2948 0.0205673 17.0525 0.0205673 16.7805C0.0205673 16.5088 0.126901 16.2665 0.339568 16.0535L7.48557 8.9075L0.301068 1.773C0.0884014 1.56 -0.0115986 1.31767 0.00106805 1.046C0.014068 0.774336 0.126901 0.532 0.339568 0.319C0.552234 0.106334 0.794568 0 1.06657 0C1.33823 0 1.58057 0.106334 1.79357 0.319L8.93957 7.5035L16.0741 0.319C16.2871 0.106334 16.5231 0 16.7821 0C17.0411 0 17.2769 0.106334 17.4896 0.319C17.7102 0.539667 17.8206 0.783835 17.8206 1.0515C17.8206 1.3195 17.7102 1.56 17.4896 1.773L10.3436 8.9075L17.5281 16.092C17.7407 16.305 17.8471 16.541 17.8471 16.8C17.8471 17.059 17.7407 17.2948 17.5281 17.5075C17.3074 17.7282 17.0632 17.8385 16.7956 17.8385C16.5276 17.8385 16.2871 17.7282 16.0741 17.5075L8.93957 10.3615Z"
                    fill="white" />
            </svg>
        </div>

        <div class="projects-dialog__screen-shot"
            [style.background-image]="'url(' + projectService.currentProject()?.screenShot + ')'">
        </div>

        <div class="projects-dialog__next">
            <button (click)="updateCurrentProject()">
                <span>Next project</span>
                <svg width="19" height="19" viewBox="0 0 19 19" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M16.105 9.74506H0.666667C0.476889 9.74506 0.318333 9.68139 0.191 9.55406C0.0636665 9.42673 0 9.26817 0 9.07839C0 8.88862 0.0636665 8.73006 0.191 8.60273C0.318333 8.47539 0.476889 8.41173 0.666667 8.41173H16.105L8.854 1.16039C8.724 1.03062 8.656 0.877615 8.65 0.701393C8.644 0.525393 8.71456 0.363838 8.86167 0.216727C9.00856 0.0749489 9.16578 0.00272669 9.33333 6.00198e-05C9.50089 -0.00238442 9.65811 0.0698378 9.805 0.216727L17.9127 8.32439C18.0291 8.44084 18.1108 8.55973 18.1577 8.68106C18.2048 8.80239 18.2283 8.93484 18.2283 9.07839C18.2283 9.22195 18.2048 9.35439 18.1577 9.47573C18.1108 9.59706 18.0291 9.71595 17.9127 9.83239L9.805 17.9401C9.68033 18.0647 9.52867 18.1314 9.35 18.1401C9.17133 18.1485 9.00856 18.0818 8.86167 17.9401C8.71456 17.7929 8.641 17.6344 8.641 17.4644C8.641 17.2942 8.71456 17.1356 8.86167 16.9887L16.105 9.74506Z"
                        fill="#3DCFB6" />
                </svg>
            </button>
        </div>

    </div>

    <div class="projects-dialog__info">

        <div class="projects-dialog__title">
            <span class="projects-dialog__index">0{{ getProjectIndex() }}</span>
            <h2 class="projects-dialog__heading">{{ projectService.currentProject()?.projectName }}</h2>
        </div>

        <h3 class="projects-dialog__subheading">What is this project about?</h3>
        <p class="projects-dialog__text">{{ projectService.currentProject()?.description }}</p>

        <div class="projects-dialog__skills">
            @for (technology of projectService.currentProject()?.technologies; track $index) {
            <div class="skill-item">
                <span>{{ technology.technology }}</span>
                <img [src]="technology.svg" [alt]="technology.technology" width="24" height="24">
            </div>
            }
        </div>

        <div class="projects-dialog__links">
            <a class="projects-dialog__links-container" href="{{projectService.currentProject()?.gitHubLink}}"
                target="_blank">
                <span>GitHub</span>
                <svg width="13" height="13" viewBox="0 0 13 13" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M10.5714 3.39945L1.69074 12.2803C1.48438 12.4865 1.25414 12.5847 1.00002 12.5748C0.745903 12.5649 0.515743 12.4568 0.309542 12.2506C0.103181 12.0443 0 11.8091 0 11.545C0 11.281 0.103181 11.0458 0.309542 10.8395L9.16047 1.98854H1.79065C1.51193 1.98854 1.27658 1.89303 1.08459 1.702C0.892448 1.51081 0.796375 1.27658 0.796375 0.999303C0.796375 0.722025 0.892448 0.486114 1.08459 0.291573C1.27658 0.0971906 1.51193 0 1.79065 0H11.5656C11.8444 0 12.0798 0.0959935 12.2719 0.28798C12.4639 0.480125 12.5599 0.715556 12.5599 0.994271V10.7693C12.5599 11.048 12.4644 11.2834 12.2734 11.4756C12.0822 11.6675 11.848 11.7635 11.5707 11.7635C11.2934 11.7635 11.0576 11.6675 10.8632 11.4756C10.6686 11.2834 10.5714 11.048 10.5714 10.7693V3.39945Z"
                        fill="#3DCFB6" />
                </svg>
            </a>
            <a class="projects-dialog__links-container" href="{{projectService.currentProject()?.LiveTestLink}}"
                target="_blank">
                <span>Live Test</span>
                <svg width="13" height="13" viewBox="0 0 13 13" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M10.5714 3.39945L1.69074 12.2803C1.48438 12.4865 1.25414 12.5847 1.00002 12.5748C0.745903 12.5649 0.515743 12.4568 0.309542 12.2506C0.103181 12.0443 0 11.8091 0 11.545C0 11.281 0.103181 11.0458 0.309542 10.8395L9.16047 1.98854H1.79065C1.51193 1.98854 1.27658 1.89303 1.08459 1.702C0.892448 1.51081 0.796375 1.27658 0.796375 0.999303C0.796375 0.722025 0.892448 0.486114 1.08459 0.291573C1.27658 0.0971906 1.51193 0 1.79065 0H11.5656C11.8444 0 12.0798 0.0959935 12.2719 0.28798C12.4639 0.480125 12.5599 0.715556 12.5599 0.994271V10.7693C12.5599 11.048 12.4644 11.2834 12.2734 11.4756C12.0822 11.6675 11.848 11.7635 11.5707 11.7635C11.2934 11.7635 11.0576 11.6675 10.8632 11.4756C10.6686 11.2834 10.5714 11.048 10.5714 10.7693V3.39945Z"
                        fill="#3DCFB6" />
                </svg>
            </a>
        </div>

    </div>

</dialog>
